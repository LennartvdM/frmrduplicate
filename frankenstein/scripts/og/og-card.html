<!--
  Source artwork for public/og-preview.png — the 1200x630 card that Slack,
  LinkedIn, iMessage, WhatsApp and X show when someone shares a neoflix.care
  link. Every page references it (src/seo/siteMeta.js DEFAULT_OG_IMAGE).

  It is a static asset, not part of the build: re-render it by hand when the
  wordmark or the tagline changes. With Chromium on PATH:

    chromium --headless --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,717 \
      --screenshot=og.png scripts/og/og-card.html

  Headless Chromium reserves 87px of the window for chrome, so 717 yields a
  630px viewport; crop the result to the top 1200x630. Colours are the app's
  own: TEAL/DARK from neoflix-intro-card/src/RecordReflectRefine.jsx and
  --cool-page from src/index.css.

  There is also an interactive uploader at frankenstein/og-upload.html which
  commits a replacement straight to the repo.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400 700;
    src: url('../../public/fonts/inter-latin.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #ffffff; }
  .card {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 92px;
    background: linear-gradient(160deg, #ffffff 0%, #f5f9fc 55%, #e9f2f5 100%);
    font-family: Inter, system-ui, sans-serif;
    color: rgb(56, 52, 55);
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    right: -190px;
    top: -170px;
    width: 720px;
    height: 720px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(72,193,196,0.17) 0%, rgba(72,193,196,0) 68%);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 46px;
  }
  .brand img { width: 54px; height: 57px; }
  .brand span {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  h1 {
    font-size: 92px;
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -0.035em;
    margin-bottom: 30px;
  }
  h1 .teal { color: rgb(82, 156, 156); }
  p {
    font-size: 33px;
    line-height: 1.35;
    font-weight: 400;
    color: rgba(56, 52, 55, 0.72);
    max-width: 830px;
  }
  .rule {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 12px;
    background: linear-gradient(90deg, rgb(82,156,156) 0%, rgb(72,193,196) 100%);
  }
  .url {
    position: absolute;
    right: 92px;
    bottom: 54px;
    font-size: 25px;
    font-weight: 500;
    color: rgba(56, 52, 55, 0.5);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="card">
  <div class="glow"></div>
  <div class="brand">
    <img src="../../public/favicon.svg" alt="">
    <span>Neoflix</span>
  </div>
  <h1>Record. <span class="teal">Reflect.</span> Refine.</h1>
  <p>Video review for medical teams — improve patient care through video reflection.</p>
  <div class="url">neoflix.care</div>
  <div class="rule"></div>
  </div>
</body>
</html>
