[build]
  command = "bash build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Routing: there is deliberately no /* -> /index.html SPA rewrite here.
# build-route-html.mjs writes a physical index.html for every real route
# (so deep links and social scrapers get the right head), dist/_redirects
# carries 301s for two generations of legacy toolbox URLs, and anything
# left over falls through to dist/404.html, which Netlify serves with a
# genuine 404 status. The 404 shell is still the app, so visitors see
# the styled not-found page with the navbar intact.

# Security headers. The CSP is strict because the app is self-contained:
# fonts are self-hosted, the only iframe is the Vimeo player, and the two
# extra img-src hosts serve favicon/screenshot fallbacks for external
# link preview cards on the blog-style pages.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google.com https://s.wordpress.com; media-src 'self'; font-src 'self'; frame-src https://player.vimeo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Publication PDFs and the bundle archive. Not immutable — a paper's
# file can be swapped for a corrected version under the same name, and a
# year-long immutable cache would strand readers on the old one.
#
# noindex keeps these convenience copies out of search results. They
# exist for people already on the page; letting Google index them would
# put a bare PDF in the results competing with the publisher's own
# article page, and land searchers on a file with no way back into the
# site. The publisher link in each section stays the indexable route.
[[headers]]
  for = "/papers/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
    X-Robots-Tag = "noindex"

# Never cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.htm"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
