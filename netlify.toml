[build]
  command = "bash build.sh"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  # Pull submodule HEADs (docs-content) fresh on every build so the
  # live site tracks the latest GitBook push. The doc repo has its own
  # GitHub webhook pointed at Netlify's build hook for auto-rebuilds.
  GIT_LFS_ENABLED = "false"
  SUBMODULE_STRATEGY = "recursive"

# Cookieless analytics endpoints. The functions also declare these paths
# themselves (`export const config`), but the rewrites are what guarantee
# the routes on every Netlify runtime — and they must live here rather
# than in _redirects so they resolve before the SPA fallback.
[[redirects]]
  from = "/api/event"
  to = "/.netlify/functions/event"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

# SPA routing lives in dist/_redirects, generated by
# frankenstein/scripts/prerender-seo.mjs. Netlify evaluates netlify.toml
# redirects BEFORE _redirects, so a `/*` catch-all here would shadow the
# legacy-slug 301s below it. Keeping every rule in one generated file
# keeps the ordering explicit: 301s first, SPA fallback last.

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.htm"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
